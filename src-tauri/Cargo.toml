[package]
name = "videocut"
version = "0.1.0"
description = "Desktop video clipping assistant"
authors = ["SnipPaw"]
edition = "2021"

[lib]
name = "videocut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

# Keeps release builds portable across Rust distributions that do not ship
# rust-objcopy (for example, the current Homebrew package on macOS).
[profile.release]
strip = false

